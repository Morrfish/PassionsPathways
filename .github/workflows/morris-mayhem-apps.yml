# Builds Morris Mayhem as a Windows app (exe) and an Android app (APK).
# Both are kept as build artifacts on the run page: only people signed in
# to GitHub with access to this repo can download them. Nothing is published.
name: Morris Mayhem apps

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/amazing-clarke-7d1ctl']
    paths:
      - 'morris-mayhem/**'
      - '.github/workflows/morris-mayhem-apps.yml'

permissions:
  contents: read

concurrency:
  group: morris-mayhem-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the game
        working-directory: morris-mayhem
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build the exe
        working-directory: morris-mayhem/desktop
        run: |
          npm install --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: MorrisMayhem-Windows
          path: morris-mayhem/desktop/dist/MorrisMayhem.exe
          retention-days: 90
          compression-level: 0

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the game
        working-directory: morris-mayhem
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Make the Android project
        working-directory: morris-mayhem
        run: |
          npx cap add android
          npx --yes @capacitor/assets@4.0.0 generate --android --iconBackgroundColor '#14102b' --splashBackgroundColor '#14102b'
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build the APK
        working-directory: morris-mayhem/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk ../MorrisMayhem.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MorrisMayhem-Android
          path: morris-mayhem/MorrisMayhem.apk
          retention-days: 90
          compression-level: 0
