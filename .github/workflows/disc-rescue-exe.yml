# Builds Disc Rescue for Windows on a Windows machine:
#   DiscRescue.exe   one file, runs without installing
# It is kept as a build artifact on the run page: only people signed in to
# GitHub with access to this repo can download it. Nothing is published.
name: Disc Rescue exe

on:
  workflow_dispatch:
  push:
    branches: [main, 'ccr-bcf909e3-7qtnwa']
    paths:
      - 'disc-rescue/**'
      - '.github/workflows/disc-rescue-exe.yml'

permissions:
  contents: read

concurrency:
  group: disc-rescue-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: disc-rescue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build the exe
        run: |
          python make_icon.py
          pyinstaller --noconfirm --onefile --windowed --name DiscRescue --icon icon.ico `
            --add-data "discrescue/icon.png;." --add-data "discrescue/logo.png;." DiscRescue.py
      - name: Check the exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/DiscRescue.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "DiscRescue.exe closed by itself (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: DiscRescue-Windows
          path: disc-rescue/dist/DiscRescue.exe
          retention-days: 90
          compression-level: 0
