<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wild Tag</title>
<meta name="description" content="A third-person animal tag game: 22 animals and 10 mythical creatures, each with its own ability. Play solo against bots or online with friends.">
<link rel="icon" href="ui/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#173d24; --forest2:#1f5130; --forest3:#2b6a3d; --leaf:#5cb83c; --leaf2:#8fd14f;
  --cream:#fff4dc; --cream2:#f6e6c4; --wood:#7a4a25; --wood2:#5b3518; --ink:#2a1a0c;
  --sun:#ffc531; --orange:#f28c28; --coral:#ef6f5c; --ice:#9fe3ff; --red:#e8452f;
  --font:'Fredoka','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#173d24;font-family:var(--font);color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:none}
#game canvas{display:block}
button{font:inherit;cursor:pointer;color:inherit}
img{display:block;-webkit-user-drag:none}
.hide{display:none!important}
.outline{text-shadow:0 2px 0 var(--forest),2px 0 0 var(--forest),-2px 0 0 var(--forest),0 -2px 0 var(--forest),0 4px 0 rgba(0,0,0,.25)}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 35%,#2b6a3d,#173d24 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#loading img{width:min(420px,80vw)}
.bar{width:min(360px,70vw);height:26px;border-radius:99px;background:var(--cream);border:4px solid var(--forest);box-shadow:0 0 0 3px var(--cream2);overflow:hidden}
.bar i{display:block;height:100%;width:10%;background:repeating-linear-gradient(-45deg,#5cb83c 0 12px,#7fd14f 12px 24px);border-radius:99px;transition:width .3s}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.gpanel{background:linear-gradient(#1f5130,#173d24);border:3px solid #0e2616;box-shadow:0 0 0 2px rgba(255,244,220,.35) inset,0 4px 0 rgba(0,0,0,.25);border-radius:18px}
#board{position:absolute;top:10px;left:10px;width:250px;padding:0 0 6px}
#board .head{display:flex;align-items:center;gap:6px;padding:6px 12px;font-weight:700;font-size:20px;letter-spacing:.5px}
#board .row{display:flex;align-items:center;gap:8px;margin:3px 8px;padding:3px 8px;border-radius:10px;font-weight:600;font-size:16px;background:rgba(0,0,0,.18)}
#board .row .n{width:24px;height:24px;border-radius:50%;background:var(--cream);color:var(--forest);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
#board .row .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#board .row.me{background:linear-gradient(90deg,#c0502a,#e8742f);color:#fff}
#board .row.it .nm::after{content:' 🔥'}
#board .row .t{font-size:14px;opacity:.9}
#clock{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
#timer{padding:4px 26px 4px 20px;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px;min-width:170px;justify-content:center}
#modeBadge{width:190px;margin-top:-10px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
#role{position:absolute;top:150px;left:50%;transform:translateX(-50%);font-weight:700;font-size:26px;padding:6px 26px;border-radius:16px;border:3px solid #fff4dc;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#role.it{background:linear-gradient(#e8742f,#c0402a);color:#fff;animation:pulse 1s infinite}
#role.run{background:linear-gradient(#6cc548,#3b8f2c);color:#fff}
#role.frozen{background:linear-gradient(#bff0ff,#6cc8ef);color:#0b3550}
#role.lobby{background:rgba(23,61,36,.85);color:var(--cream);font-size:18px}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
#topRight{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#topRight .line{display:flex;gap:8px;align-items:center}
#gems,#mGems{display:flex;align-items:center;gap:6px;padding:4px 16px 4px 6px;font-weight:700;font-size:22px;border-radius:99px}
#gems img,#mGems img{width:34px}
#menuBtn{pointer-events:auto;width:46px;height:46px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:22px}
#radar{width:150px;height:150px;border-radius:50%;background:radial-gradient(#3f8a3a,#24592c);border:5px solid #0e2616;box-shadow:0 0 0 3px var(--cream) }
#hostStart{position:absolute;top:200px;left:50%;transform:translateX(-50%);pointer-events:auto}
#feed{position:absolute;left:12px;bottom:170px;display:flex;flex-direction:column-reverse;gap:4px;max-width:46vw}
#feed div{background:rgba(23,61,36,.8);border-radius:12px;padding:4px 12px;font-size:15px;font-weight:600}
#abil{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:8px 18px 8px 10px}
#abEm{width:62px;height:62px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:38px;border:3px solid var(--wood)}
#abTag{display:inline-block;background:var(--sun);color:var(--ink);font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;letter-spacing:.5px}
#abName{font-size:24px;font-weight:700;line-height:1.1}
#abKey{font-size:12px;opacity:.75}
.sep{width:2px;align-self:stretch;background:rgba(255,244,220,.25)}
.cdr{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),#6cc548 0);display:flex;align-items:center;justify-content:center;position:relative}
.cdr::before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--forest)}
.cdr span{position:relative;font-weight:700;font-size:18px}
.cdr.ready{box-shadow:0 0 0 3px var(--sun),0 0 18px var(--sun)}
#perks{display:flex;gap:6px}
#perks div{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid rgba(255,244,220,.35)}
#flash{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);font-size:clamp(24px,4vw,42px);font-weight:700;text-align:center;transition:opacity .3s;opacity:0;width:90vw}
#big{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);font-size:clamp(80px,14vw,170px);font-weight:700;color:var(--sun)}
#blind{position:fixed;inset:0;background:radial-gradient(circle,rgba(20,8,30,.75) 0,rgba(20,8,30,.97) 60%);opacity:0;transition:opacity .25s;pointer-events:none}
#score{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:14px 18px;min-width:min(440px,92vw);color:var(--cream)}
#score table{width:100%;border-collapse:collapse}
#score td{padding:4px 8px;font-weight:600}
#score tr.it td{color:#ffb08a}
#score tr.me td{background:rgba(232,116,47,.35)}
#results{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;min-width:min(460px,92vw);pointer-events:auto;padding:16px 26px 22px;background:var(--cream);color:var(--ink);border:9px solid var(--wood);border-radius:28px;box-shadow:0 0 0 3px var(--wood2),0 10px 0 rgba(0,0,0,.25)}
#results img{width:120px;margin:-70px auto 0}
#results h2{margin:4px 0;font-size:34px}
#results .gain{font-size:30px;font-weight:700;color:var(--wood);margin:8px 0;display:flex;align-items:center;justify-content:center;gap:8px}
#results .gain img{width:40px;margin:0}
#crosshint{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--cream);background:rgba(23,61,36,.65);padding:3px 12px;border-radius:99px;white-space:nowrap}

/* touch */
#stick{position:fixed;width:130px;height:130px;border-radius:50%;background:rgba(255,244,220,.18);border:4px solid rgba(255,244,220,.6);opacity:0;pointer-events:none}
#stick.on{opacity:1}
#knob{position:absolute;left:35px;top:35px;width:52px;height:52px;border-radius:50%;background:var(--cream);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tbtn{position:fixed;border-radius:50%;border:4px solid var(--cream);color:#fff;font-weight:700;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;box-shadow:0 5px 0 rgba(0,0,0,.3)}
#tjump{right:22px;bottom:30px;width:112px;height:112px;font-size:18px;background:radial-gradient(#3f9a45,#1f5130)}
#tab{right:150px;bottom:24px;width:90px;height:90px;font-size:14px;background:radial-gradient(#e8742f,#a8331f)}
.tbtn b{font-size:34px;line-height:1}
body.touch.playing .tbtn{display:flex}
body.touch #crosshint{display:none}
body.touch #abil{bottom:6px;transform:translateX(-50%) scale(.72);transform-origin:bottom center}
body.touch #feed{bottom:150px}
body.touch #radar{width:110px;height:110px}

/* ---------- MENU ---------- */
.menu{position:fixed;inset:0;pointer-events:none;display:flex}
.side{pointer-events:auto;width:320px;flex:none;height:100%;background:linear-gradient(160deg,#1f5130,#173d24 60%,#123220);border-right:4px solid #0e2616;border-radius:0 34px 34px 0;padding:12px 20px 14px;display:flex;flex-direction:column;gap:9px;overflow:auto;box-shadow:6px 0 0 rgba(0,0,0,.2)}
.side .logo{width:200px;margin:0 auto;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.imgbtn{background:none;border:0;padding:0;transition:transform .12s;filter:drop-shadow(0 4px 2px rgba(0,0,0,.3));width:100%;max-width:270px;margin:0 auto}
.imgbtn img{width:100%}
.imgbtn:hover{transform:scale(1.04)}
.imgbtn:active{transform:scale(.97)}
.resume{background:linear-gradient(#ffd34d,#f5a623);border:3px solid #0e2616;color:var(--ink);border-radius:99px;font-size:26px;font-weight:700;padding:10px;box-shadow:0 4px 0 #0e2616}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.tile{background:linear-gradient(#2b6a3d,#1f5130);border:3px solid #0e2616;border-radius:18px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:15px;letter-spacing:.5px;box-shadow:0 0 0 2px rgba(255,244,220,.25) inset}
.tile img{width:52px}
.tile .em{font-size:34px;line-height:52px;height:52px}
.tile:hover{filter:brightness(1.15)}
.tile.on{box-shadow:0 0 0 3px var(--sun)}
.smalllinks{display:flex;gap:8px;margin-top:auto}
.smalllinks button{flex:1;background:rgba(0,0,0,.25);border:2px solid rgba(255,244,220,.25);border-radius:12px;padding:8px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.smalllinks img{width:26px}
.namebox{display:flex;align-items:center;gap:8px;font-weight:600}
.namebox input{flex:1;min-width:0;background:var(--cream);color:var(--ink);border:3px solid #0e2616;border-radius:12px;padding:6px 10px;font:inherit;font-weight:700}
.stage{flex:1;position:relative;min-width:0}
#mGems{position:absolute;top:14px;right:14px;pointer-events:auto}
/* parchment panel for shop + setup pages */
.sheet{pointer-events:auto;position:absolute;inset:70px 18px 18px 18px;background:var(--cream);color:var(--ink);border:9px solid var(--wood);border-radius:28px;box-shadow:0 0 0 3px var(--wood2),0 0 0 6px #e8c98f inset,0 10px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}
.sheet .top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(#8a5a2d,#6a3f1c);color:var(--cream)}
.sheet .top h1{margin:0;font-size:26px;flex:1}
.sheet .x{width:42px;height:42px;border-radius:50%;background:var(--coral);border:3px solid var(--cream);font-size:20px;font-weight:700;color:#fff}
.sheet .body{flex:1;display:flex;gap:16px;padding:14px 16px;min-height:0}
.pane{flex:1;overflow:auto;min-width:0;padding-right:4px}
.pside{width:280px;display:flex;flex-direction:column;gap:10px}
#preview{width:280px;height:280px;border-radius:20px;background:radial-gradient(circle,#4f9a52,#24592c);border:4px solid var(--wood)}
.selinfo{background:var(--cream2);border:3px solid #e2c48d;border-radius:16px;padding:10px 12px;color:var(--ink)}
.selinfo h3{margin:0 0 2px;font-size:22px}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.stat .b{flex:1;height:9px;background:#e5d1a6;border-radius:9px;overflow:hidden}
.stat .b i{display:block;height:100%;background:linear-gradient(90deg,#5cb83c,#8fd14f)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{background:#fffaf0;border:3px solid #e2c48d;border-radius:16px;padding:8px;text-align:center;cursor:pointer;position:relative;transition:transform .1s;color:var(--ink)}
.card:hover{transform:translateY(-2px);border-color:var(--orange)}
.card.sel{border-color:var(--leaf);box-shadow:0 0 0 3px var(--leaf)}
.card.locked{background:#f1e4c8}
.card .em{font-size:40px;line-height:1.2}
.card .nm{font-weight:700;font-size:16px}
.card .ab{font-size:12px;color:#6b4a2b;min-height:30px;font-weight:500}
.card .pr{font-weight:700;color:#b5651d;font-size:15px;display:flex;align-items:center;justify-content:center;gap:3px}
.card .pr img{width:18px}
.card .own{font-size:12px;color:#2f8a2f;font-weight:700}
.card.mythic{background:linear-gradient(160deg,#f6ecff,#ffe9f6);border-color:#c79aef}
.card .b3d{position:absolute;top:6px;right:6px;background:var(--leaf);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;border:2px solid #fff}
.card .req{font-size:11px;color:#a03a6a;font-weight:600}
.swatch{width:100%;height:46px;border-radius:10px;margin-bottom:6px;background-size:cover;border:2px solid #e2c48d}
h2.sec{margin:14px 0 8px;font-size:22px;color:var(--wood2)}
h2.sec:first-child{margin-top:0}
h2.sec small{font-size:14px;color:#8a6a45;font-weight:500}
.colors{display:flex;flex-wrap:wrap;gap:6px}
.colors button{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e2c48d}
.colors button.on{box-shadow:0 0 0 3px var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0;font-weight:600}
.btn{background:linear-gradient(#ffd34d,#f5a623);color:var(--ink);border:3px solid var(--wood2);border-radius:16px;padding:10px 22px;font-weight:700;font-size:20px;box-shadow:0 4px 0 var(--wood2)}
.btn.green{background:linear-gradient(#7fd14f,#3b8f2c);color:#fff}
.btn.alt{background:#fffaf0;color:var(--ink)}
.btn.big{font-size:28px;padding:12px 40px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--wood2)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{background:none;border:3px solid transparent;border-radius:20px;padding:6px;cursor:pointer;text-align:center;color:var(--ink)}
.mode img{width:100%;max-width:260px;margin:0 auto}
.mode p{margin:2px 6px 0;font-size:13px;font-weight:500;color:#6b4a2b}
.mode.sel{border-color:var(--leaf);background:#eaf7d9}
select,.sheet input[type=text]{background:#fffaf0;color:var(--ink);border:3px solid #e2c48d;border-radius:12px;padding:6px 10px;font:inherit;font-weight:700}
.box{background:var(--cream2);border:3px solid #e2c48d;border-radius:16px;padding:14px;margin-top:10px}
.code{font-size:44px;font-weight:700;letter-spacing:8px;color:var(--orange)}
.status{color:#6b4a2b;font-size:15px;margin-top:6px;font-weight:500}
.status.err{color:#c0392b}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--sun);color:var(--ink);font-weight:700;padding:10px 20px;border-radius:14px;border:3px solid var(--wood2);z-index:70;transition:opacity .4s}
.how li{margin:6px 0;font-weight:500}
kbd{background:#fffaf0;border:2px solid #e2c48d;border-radius:6px;padding:0 6px;font-family:inherit;font-weight:700}
/* short screens (phones sideways, small laptops): keep the side panel, make it compact */
@media (max-height:640px){
  .side{width:260px;padding:8px 14px;gap:6px}
  .side .logo{width:130px}
  .imgbtn{max-width:210px}
  .tiles{grid-template-columns:repeat(4,1fr);gap:5px}
  .tile{font-size:0;padding:4px 2px;border-radius:12px}
  .tile img{width:40px}.tile .em{font-size:28px;line-height:40px;height:40px}
  .namebox,.smalllinks button{font-size:13px}.smalllinks button{padding:4px}
  .sheet{inset:58px 8px 8px 8px;border-width:6px}
  .sheet .top{padding:4px 12px}.sheet .top h1{font-size:20px}.sheet .x{width:34px;height:34px}
  .sheet .body{padding:8px 10px}
  .pside{width:190px}#preview{width:190px;height:150px}.selinfo{font-size:12px;padding:6px}.selinfo h3{font-size:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  #board{transform:scale(.7);transform-origin:top left}
  #clock{transform:translateX(-50%) scale(.75);transform-origin:top center}
  #role{top:112px;font-size:18px;padding:4px 16px}
  #topRight{transform:scale(.75);transform-origin:top right}
}
/* narrow screens (phones upright): stack the menu */
@media (max-width:600px){
  .menu{flex-direction:column;overflow:auto;pointer-events:auto;background:#173d24}
  .side{width:100%;height:auto;border-radius:0 0 28px 28px}
  .stage{min-height:80vh}
  .sheet{position:relative;inset:auto;margin:60px 8px 16px}
  .sheet .body{flex-direction:column-reverse}
  .pside{width:100%;flex-direction:row}
  #preview{width:140px;height:140px;flex:none}
  #board{transform:scale(.65);transform-origin:top left}
  #clock{transform:translateX(-50%) scale(.7);transform-origin:top center}
  #role{top:110px;font-size:18px}
  #topRight{transform:scale(.7);transform-origin:top right}
}
</style>
</head>
<body>
<div id="game"></div>

<div id="loading"><img src="ui/logo.png" alt="Wild Tag"><div class="bar"><i id="loadBar"></i></div></div>

<div id="hud" class="hide">
  <div id="board" class="gpanel"></div>
  <div id="clock"><div id="timer" class="gpanel"><span>⏱</span><span id="time">0:00</span></div><img id="modeBadge" src="ui/mode-infection.png" alt=""></div>
  <div id="role" class="lobby">Free roam</div>
  <button id="hostStart" class="btn green hide">▶ Start Round</button>
  <div id="topRight">
    <div class="line"><div class="gpanel" id="gems"><img src="ui/icon-gems.png" alt=""><span>0</span></div><button id="menuBtn" class="gpanel" title="Menu">☰</button></div>
    <canvas id="radar" width="150" height="150"></canvas>
  </div>
  <div id="feed"></div>
  <div id="abil" class="gpanel">
    <div id="abEm">🦍</div>
    <div><span id="abTag">GORILLA ABILITY</span><div id="abName">Ability</div><div id="abKey">Press E</div></div>
    <div class="sep"></div>
    <div class="cdr" id="abCd"><span></span></div>
    <div id="perks"></div>
  </div>
  <div id="crosshint">WASD move · Space jump (jump into walls to push off!) · E ability · Tab scores · Esc menu</div>
  <div id="flash" class="outline"></div>
  <div id="big" class="outline"></div>
  <div id="score" class="gpanel hide"></div>
  <div id="results" class="hide"></div>
</div>
<div id="blind"></div>
<div id="stick"><div id="knob"></div></div>
<button class="tbtn" id="tjump"><b>⇑</b>JUMP</button>
<button class="tbtn" id="tab"><b>✨</b>ABILITY</button>

<div class="menu hide" id="menu">
  <div class="side">
    <img class="logo" src="ui/logo.png" alt="Wild Tag">
    <button class="resume hide" id="resumeBtn">▶ RESUME</button>
    <button class="imgbtn" data-go="solo"><img src="ui/btn-solo.png" alt="Play Solo"></button>
    <button class="imgbtn" data-go="host"><img src="ui/btn-host.png" alt="Host Game"></button>
    <button class="imgbtn" data-go="join"><img src="ui/btn-join.png" alt="Join Game"></button>
    <div class="tiles">
      <button class="tile" data-go="animals"><img src="ui/icon-animals.png" alt="">ANIMALS</button>
      <button class="tile" data-go="wardrobe"><span class="em">🎨</span>PATTERNS</button>
      <button class="tile" data-go="wear"><img src="ui/icon-wardrobe.png" alt="">WEARABLES</button>
      <button class="tile" data-go="perks"><span class="em">⚡</span>ABILITIES</button>
    </div>
    <div class="namebox">Name <input id="nameIn" maxlength="16"></div>
    <div class="smalllinks"><button data-go="how">❓ How to play</button><button data-go="settings"><img src="ui/icon-settings.png" alt="">Settings</button></div>
  </div>
