<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bot Assembly Shop</title>
<meta name="description" content="Build a robot from parts, then drive it through speed, strength and crazy obstacle courses. Design your own courses and share them.">
<style>
:root{--bg:#12161c;--panel:#1c232d;--panel2:#252e3a;--line:#34404f;--ink:#eef2f6;--dim:#9aa7b6;--y:#ffc21a;--o:#ff5a36;--t:#2ad4c0;--g:#35d07f;--b:#4d8dff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;background:var(--panel2);padding:9px 14px;font-weight:700;transition:transform .08s,background .15s}
button:hover{background:#30405a}button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--t);outline-offset:2px}
button.primary{background:var(--y);color:#1a1300}button.primary:hover{background:#ffd24d}
button.go{background:var(--g);color:#06220f;font-size:18px;padding:12px 22px}button.go:hover{background:#5be09a}
button.go:disabled{background:#3a4654;color:#7d8a99;cursor:not-allowed}
button.danger{background:#5a2620}button.small{padding:5px 10px;font-size:13px;border-radius:8px}
input[type=text],input[type=number],select,textarea{background:#0e1217;border:1px solid var(--line);border-radius:8px;padding:7px 9px;-webkit-user-select:text;user-select:text}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:none;overflow:auto;background:var(--bg)}
.screen.on{display:block}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--y) 0 14px,#1a1a1a 14px 28px)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:.2px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}

/* Home */
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:22px 0 10px}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.05}
.hero h1 span{color:var(--y)}
.hero p{margin:6px 0 0;color:var(--dim);max-width:560px}
.hero .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sect{margin-top:26px}
.sect h2{font-size:20px;display:flex;align-items:center;gap:10px}
.sect h2 small{font-weight:500;color:var(--dim);font-size:14px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.tag.boss{background:#5a1a1a;color:#ffb3a8}.card.boss{border-color:#7a2a22}
.stars{color:var(--y);font-size:13px;margin-left:8px;letter-spacing:1px;white-space:nowrap}.stars i{font-style:normal;color:#3a4654}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips span{background:var(--panel2);border-radius:99px;padding:4px 10px;font-size:13px}
.tabs{display:flex;gap:6px;margin:4px 0 8px}.tabs button{flex:1;padding:7px 8px;font-size:13.5px;border:2px solid transparent}.tabs button.on{border-color:var(--y);background:#2b2a16}
.paint h4{margin:12px 0 5px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--y)}.paint input[type=text]{width:100%}
.paint input[type=color]{width:30px;height:28px;padding:0;border:0;background:none;cursor:pointer}
.opts{display:flex;flex-wrap:wrap;gap:5px}.opts button{padding:5px 9px;font-size:12.5px;border:2px solid transparent;border-radius:8px;font-weight:600}.opts button.on{border-color:var(--g);background:#1d3329}
.stick{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.stick button{padding:3px 0;font-size:18px;border:2px solid transparent;border-radius:8px}.stick button.on{border-color:var(--g);background:#1d3329}
.pad{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.pad canvas{width:216px;height:216px;border-radius:8px;touch-action:none;cursor:crosshair;border:2px solid var(--line)}.pad>div{flex:1;min-width:120px}
.tag.speed{background:#12406e;color:#9fd0ff}.tag.strength{background:#6a3a12;color:#ffcf9a}.tag.crazy{background:#4a2a7a;color:#e0c4ff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-3px);border-color:var(--y)}
.card canvas{width:100%;height:84px;display:block;image-rendering:pixelated}
.card .cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.card .cb b{font-size:16px}.card .cb p{margin:0;color:var(--dim);font-size:13px;flex:1}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim)}
.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.card.new{align-items:center;justify-content:center;min-height:170px;border-style:dashed;color:var(--dim);font-weight:800;font-size:17px;gap:6px}

/* Garage */
#garage{display:none;flex-direction:column}#garage.on{display:flex}
.gtop{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.gtop h2{font-size:20px}.gtop .sp{flex:1}
.budget{min-width:210px}.budget .bar{height:10px;background:#0e1217;border-radius:9px;overflow:hidden;margin-top:3px}
.budget .bar i{display:block;height:100%;background:var(--g);transition:width .2s}.budget.over .bar i{background:var(--o)}.budget.over b{color:var(--o)}
.gbody{flex:1;display:grid;grid-template-columns:330px 1fr 300px;min-height:0}
.gcol{overflow:auto;padding:14px}
.gleft{background:var(--panel);border-right:1px solid var(--line)}.gright{background:var(--panel);border-left:1px solid var(--line)}
#preview{width:100%;height:210px;border-radius:12px;background:linear-gradient(#2a3442,#161b22);display:block}
.namerow{display:flex;gap:8px;margin:10px 0}.namerow input{flex:1;min-width:0;font-weight:700}
.swatches{display:flex;gap:6px;flex-wrap:wrap}.swatches button{width:26px;height:26px;padding:0;border-radius:50%;border:3px solid transparent}.swatches button.on{border-color:#fff}
.stat{margin-top:11px}.stat .l{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}.stat .l b{color:var(--ink)}
.stat .bar{height:8px;background:#0e1217;border-radius:9px;overflow:hidden;margin-top:3px}.stat .bar i{display:block;height:100%;background:var(--t);transition:width .25s}
.stat small{color:var(--dim);font-size:12px}
.psec{margin-bottom:18px}.psec h3{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--y);margin-bottom:3px}
.psec .why{color:var(--dim);font-size:13px;margin-bottom:8px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.part{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:9px 10px;text-align:left;font-weight:500;display:flex;flex-direction:column;gap:3px}
.part b{font-size:14.5px;display:flex;justify-content:space-between;gap:6px}.part b em{font-style:normal;color:var(--y)}
.part span{font-size:12.5px;color:var(--dim);line-height:1.3}.part i{font-style:normal;font-size:12px;color:var(--t)}
.part.on{border-color:var(--g);background:#1d3329}.part.on b::before{content:"✓ ";color:var(--g)}
.gcat{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--t);margin:10px 0 6px}
.gearrow{display:flex;align-items:center;gap:10px}.gearrow input{flex:1;accent-color:var(--y)}.gearrow span{font-size:13px;color:var(--dim);white-space:nowrap}
.gearinfo{font-size:13.5px;margin-top:6px}.gearinfo b{color:var(--y)}
.intel{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.intel li{background:var(--panel2);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--dim)}.intel li b{color:var(--ink);display:block;font-size:14px}
#mini{width:100%;height:70px;border-radius:10px;display:block;margin-top:8px;image-rendering:pixelated}
.coach{background:#2b2a16;border:1px solid #6a5b16;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px}.coach b{color:var(--y)}.coach ul{margin:6px 0 0;padding-left:18px}.coach li{margin-bottom:5px}
label.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:12px;color:var(--dim);cursor:pointer}

/* HUD */
#hud{position:fixed;inset:0;display:none;pointer-events:none}#hud.on{display:block}
#hud>*{position:absolute}
.hbox{background:rgba(14,18,23,.78);border-radius:12px;padding:8px 12px;backdrop-filter:blur(4px)}
#hTL{left:12px;top:12px}#hTL .nm{font-size:13px;color:var(--dim)}#hTL .tm{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}#hTL .pn{font-size:12px;color:var(--o)}
#hTR{right:12px;top:12px;display:flex;gap:6px;pointer-events:auto}
#hProg{left:50%;top:14px;transform:translateX(-50%);width:min(40vw,420px);height:8px;background:rgba(14,18,23,.7);border-radius:9px}#hProg i{display:block;height:100%;background:var(--y);border-radius:9px;width:0}
#hMsg{left:50%;top:18%;transform:translateX(-50%);font-size:22px;font-weight:800;text-align:center;text-shadow:0 2px 8px #000;white-space:nowrap}
#hMsg.good{color:var(--g)}#hMsg.bad{color:#ffd2c8}
#hBL{left:12px;bottom:12px;width:230px}
#hBL .spd{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}#hBL .spd small{font-size:13px;color:var(--dim);font-weight:600}
.meter{margin-top:6px;font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}.meter .bar{height:8px;background:#0e1217;border-radius:9px;overflow:hidden;margin-top:2px}.meter .bar i{display:block;height:100%;width:50%}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-weight:800;font-size:11.5px;margin-left:6px;visibility:hidden}
.badge.on{visibility:visible}.badge.stall{background:var(--o);color:#fff}.badge.slip{background:var(--y);color:#1a1300}
#hBR{right:12px;bottom:12px;font-size:12.5px;color:var(--dim);max-width:260px}#hBR kbd{background:#34404f;color:#fff;border-radius:5px;padding:1px 6px;font:700 12px system-ui;margin-right:4px}#hBR div{margin:2px 0}
#touch{position:fixed;inset:auto 0 0 0;display:none;pointer-events:none;padding:14px;justify-content:space-between;align-items:flex-end}
#touch.on{display:flex}#touch div{display:flex;gap:10px;flex-wrap:wrap;max-width:46vw}
#touch button{pointer-events:auto;width:64px;height:64px;border-radius:50%;font-size:24px;background:rgba(28,35,45,.8);border:2px solid var(--line);touch-action:none}

/* Editor */
#edUI{position:fixed;inset:0;display:none;pointer-events:none}#edUI.on{display:block}
#edTop{position:absolute;left:0;right:0;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:auto}
#edTop input[type=text]{width:170px;font-weight:700}#edTop input[type=number]{width:80px}#edTop select{max-width:150px}#edTop .sp{flex:1}
#edPal{position:absolute;left:0;top:54px;bottom:0;width:196px;background:var(--panel);border-right:1px solid var(--line);padding:10px;overflow:auto;pointer-events:auto}
#edPal h4{margin:10px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--y)}#edPal h4:first-child{margin-top:0}
.tg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tool{padding:4px;height:40px;display:flex;align-items:center;justify-content:center;border:2px solid transparent;font-size:18px}
.tool.on{border-color:var(--g);background:#1d3329}.tool svg{width:26px;height:26px}
.tool.wide{grid-column:span 2;font-size:13px;gap:5px}
.ol{display:flex;flex-direction:column;gap:4px}.ol .tool{justify-content:flex-start;gap:8px;font-size:13px;height:34px;padding:4px 8px}
#edTip{position:absolute;left:208px;bottom:12px;right:12px;text-align:center;pointer-events:none}#edTip span{display:inline-block;background:rgba(14,18,23,.85);border-radius:10px;padding:7px 14px;font-size:13.5px}

/* Modal */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,8,11,.72);padding:16px;z-index:20}
#modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:22px;-webkit-user-select:text;user-select:text}
.mbox h2{font-size:26px}.mbox p{color:var(--dim)}.mbox .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.big{font-size:54px;line-height:1;margin:6px 0}.res{display:flex;gap:18px;align-items:center}.res .tm{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums}
.mbox textarea{width:100%;height:110px;font:12px/1.3 ui-monospace,monospace;word-break:break-all}
.mbox table{width:100%;border-collapse:collapse;font-size:13px}.mbox td,.mbox th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:10px}.keys kbd{background:#34404f;border-radius:6px;padding:2px 8px;font:700 13px system-ui;text-align:center}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--y);color:#1a1300;font-weight:800;padding:9px 16px;border-radius:99px;display:none;z-index:30}
@media(max-width:980px){.gbody{grid-template-columns:1fr;overflow:auto}.gcol{overflow:visible}.gleft,.gright{border:0}#hBR{display:none}}
@media print{body{overflow:visible;background:#fff;color:#000}#stage,.screen,#hud,#edUI,#touch{display:none!important}#modal{position:static;background:none;display:block}.mbox{border:0;max-height:none;background:#fff;color:#000}.mbox .acts{display:none}.mbox p{color:#333}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<section id="home" class="screen on"></section>
<section id="garage" class="screen"></section>
<div id="hud">
  <div id="hTL" class="hbox"><div class="nm"></div><div class="tm">0.00</div><div class="pn"></div></div>
  <div id="hProg"><i></i></div>
  <div id="hTR"><button class="small" data-a="restart" title="Start the course over (Backspace)">⟲ Restart</button><button class="small" data-a="shop" title="Back to the shop to change parts">🔧 Shop</button><button class="small" data-a="pause" title="Pause (P)">Pause</button></div>
  <div id="hMsg"></div>
  <div id="hBL" class="hbox">
    <div class="spd"><span id="hSpd">0</span> <small>mph</small></div>
    <div class="meter" id="hHpBox">Health<div class="bar"><i id="hHp" style="background:var(--g)"></i></div></div>
    <div class="meter">Battery<div class="bar"><i id="hBat" style="background:var(--g)"></i></div></div>
    <div class="meter">Motor effort<span class="badge stall" id="hStall">STALLED</span><span class="badge slip" id="hSlip">WHEELSPIN</span><div class="bar"><i id="hLoad" style="background:var(--t)"></i></div></div>
    <div class="meter" id="hAmmoBox">Cannon <span id="hAmmo" style="color:var(--ink);letter-spacing:1px"></span></div>
    <div class="meter" id="hExtra" style="text-transform:none;letter-spacing:0;color:var(--ink)"></div>
    <div class="meter" id="hFuelBox">Rocket fuel<div class="bar"><i id="hFuel" style="background:var(--o)"></i></div></div>
  </div>
  <div id="hBR" class="hbox"></div>
</div>
<div id="touch"><div id="tL"></div><div id="tR"></div></div>
<div id="edUI">
  <div id="edTop"></div><div id="edPal"></div><div id="edTip"><span></span></div>
</div>
<div id="modal"><div class="mbox"></div></div>
<div id="toast"></div>
<script src="js/planck.min.js"></script>
<script src="js/core.js"></script>
<script src="js/levels.js"></script>
<script src="js/sim.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
