<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Album Studio</title>
<meta name="description" content="Plan your album: pick a theme, write your song lyrics and style tags for Suno, design your cover and build your tracklist.">
<style>
:root{--bg:#f6f1ea;--card:#fff;--ink:#1f1a2e;--dim:#655e75;--line:#ddd5c9;--accent:#6d3bd6;--accent-ink:#fff;--ok:#1b7f45;--warn:#a34a05;--chip:#efe8fb;--field:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#15121f;--card:#201b2e;--ink:#f1edf9;--dim:#a8a2ba;--line:#3a3350;--accent:#a886ff;--accent-ink:#15121f;--ok:#4ed58a;--warn:#f2b04a;--chip:#2c2540;--field:#171322}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:26px}h3{font-size:18px}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 80px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 14px}
.top h1{font-size:26px;display:flex;align-items:center;gap:10px}
.disc{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--bg) 0 12%,var(--accent) 13% 34%,var(--ink) 35% 100%)}
.top .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.saved{font-size:13px;color:var(--dim)}
button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 14px;font-weight:600}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{padding:4px 10px;font-size:14px;border-radius:8px}
button:disabled{opacity:.5;cursor:not-allowed;border-color:var(--line)}
button.danger{color:var(--warn)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps button{flex:1 1 140px;text-align:left;padding:10px 12px;display:flex;gap:8px;align-items:center}
.steps button[aria-current=step]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps .n{width:24px;height:24px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:13px;flex:none}
.steps .done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.lead{color:var(--dim);margin:4px 0 14px}
label.f{display:block;font-weight:700;margin:14px 0 4px}
.hint{font-size:14px;color:var(--dim);font-weight:400}
input[type=text],textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{resize:vertical;min-height:80px}
textarea.lyrics{min-height:340px;font-size:17px;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips .gl{font-size:13px;color:var(--dim);width:100%;margin-top:4px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:3px 11px;font-size:14px;font-weight:500}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.songs{display:grid;grid-template-columns:250px 1fr;gap:14px;align-items:start}
.slist{display:flex;flex-direction:column;gap:6px}
.slist button.song{text-align:left;display:flex;gap:8px;align-items:center;padding:9px 10px}
.slist button.song[aria-current=true]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.slist .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--dim);flex:none}
.badge.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.meter{height:12px;border-radius:999px;background:var(--chip);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--warn);transition:width .2s}
.meter.ok i{background:var(--ok)}
.count{font-weight:700}
.count.ok{color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.suno{border:2px dashed var(--line);border-radius:12px;padding:14px;margin-top:16px}
.suno.ready{border-color:var(--ok);border-style:solid}
.suno ol{margin:8px 0 0;padding-left:22px}
pre.prompt{white-space:pre-wrap;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;font:inherit}
.coverbox{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
.cover{width:100%;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--chip);display:grid;place-items:center;text-align:center;color:var(--dim);padding:12px;object-fit:cover}
.track{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.track .num{width:28px;font-weight:800;font-size:20px;color:var(--accent)}
.track .t{flex:1;font-weight:600}
.check{list-style:none;padding:0;margin:8px 0 0}
.check li{padding:4px 0 4px 30px;position:relative}
.check li::before{content:"";position:absolute;left:0;top:7px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.check li.ok::before{background:var(--ok);border-color:var(--ok)}
.check li.ok::after{content:"";position:absolute;left:6px;top:10px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:14px;padding:28px}
.sheet .head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.sheet .head img{width:200px;height:200px;object-fit:cover;border-radius:8px}
.sheet h2{font-size:30px}
.sheet .meta{color:#444;margin-top:6px}
.sheet h3{margin-top:22px;border-bottom:2px solid #111;padding-bottom:4px}
.sheet ol{margin:8px 0 0;padding-left:24px}
.sheet .style{color:#444;font-style:italic;margin:4px 0 8px}
.sheet .lyr{white-space:pre-wrap}
.sheet .sg{break-inside:avoid-page}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.nav2{display:flex;justify-content:space-between;margin-top:6px}
@media (max-width:760px){.songs,.coverbox,.grid2{grid-template-columns:1fr}.steps button{flex-basis:45%}}
@media print{
  body{background:#fff}
  .top,.steps,.noprint,.toast,.nav2{display:none!important}
  .wrap{padding:0;max-width:none}
  .sheet{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span class="disc" aria-hidden="true"></span>Album Studio</h1>
    <div class="sp">
      <span class="saved" id="saved" role="status"></span>
      <button class="small" id="btnSave" title="Save a copy of your album to this computer or your Drive">Save to file</button>
      <button class="small" id="btnOpen" title="Open an album file you saved before">Open file</button>
      <input type="file" id="fileOpen" accept=".json,application/json" hidden>
    </div>
  </div>
  <nav class="steps" id="steps" aria-label="Project steps"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// ---- Teacher settings -------------------------------------------------
var MIN_LINES = 10;   // lyric lines each song needs before it unlocks for Suno
var MIN_SONGS = 10;   // songs an album needs
var MAX_SONGS = 12;
var MIN_WORDS = 3;    // a line needs this many words to count
// -----------------------------------------------------------------------

var KEY = 'albumStudio.v1';
var STEPS = ['Album Theme', 'Write Songs', 'Album Cover', 'Tracklist', 'Finish'];

var GENRES = ['pop','rock','rap','hip hop','country','R&B','EDM','lo-fi','indie','folk','reggae','jazz','punk','metal','Latin pop','K-pop style'];
var MOODS = ['happy','sad','empowering','chill','energetic','dreamy','hopeful','angry','funny','spooky','romantic','mysterious'];
var STYLE_GROUPS = [
  ['Genre', GENRES],
  ['Mood', MOODS],
  ['Instruments', ['acoustic guitar','electric guitar','piano','drums','bass','synth','808 beats','strings','ukulele','trumpet','violin','hand claps']],
  ['Speed', ['slow','mid-tempo','fast','danceable']],
  ['Voice', ['male vocals','female vocals','duet','choir','rap vocals','soft vocals','powerful vocals']]
];
var ART_STYLES = ['cartoon','watercolor','photo-realistic','pixel art','graffiti','neon','collage','comic book','vintage poster','3D render','hand-drawn sketch','minimalist'];

function newSong(){ return {id: Math.random().toString(36).slice(2), title:'', about:'', style:'', lyrics:''}; }
function blank(){
  var songs = []; for (var i=0;i<MIN_SONGS;i++) songs.push(newSong());
  return {v:1, student:'', artist:'', title:'', genre:'', mood:'', theme:'', songs:songs,
          cover:{scene:'', colors:'', art:'', image:''}, step:0, cur:0};
}
function clean(d){
  var b = blank();
  if (!d || typeof d !== 'object' || !Array.isArray(d.songs)) return null;
  ['student','artist','title','genre','mood','theme'].forEach(function(k){ if (typeof d[k]==='string') b[k]=d[k]; });
  b.songs = d.songs.slice(0, MAX_SONGS).map(function(s){
    var n = newSong();
    ['title','about','style','lyrics'].forEach(function(k){ if (s && typeof s[k]==='string') n[k]=s[k]; });
    return n;
  });
  if (!b.songs.length) b.songs = [newSong()];
  if (d.cover && typeof d.cover==='object')
    ['scene','colors','art','image'].forEach(function(k){ if (typeof d.cover[k]==='string') b.cover[k]=d.cover[k]; });
  if (b.cover.image && b.cover.image.indexOf('data:image/') !== 0) b.cover.image = '';
  b.step = Math.min(Math.max(d.step|0,0), STEPS.length-1);
  b.cur = Math.min(Math.max(d.cur|0,0), b.songs.length-1);
  return b;
}
function load(){
  try { var d = clean(JSON.parse(localStorage.getItem(KEY))); if (d) return d; } catch(e){}
  return blank();
}
var S = load();
var saveTimer;
function saveNow(){
  clearTimeout(saveTimer);
  var el = document.getElementById('saved');
  try { localStorage.setItem(KEY, JSON.stringify(S)); el.textContent = 'Saved on this computer'; }
  catch(e){ el.textContent = 'Could not auto-save. Use Save to file!'; }
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', function(){ if (document.hidden) saveNow(); });

// ---- helpers ----------------------------------------------------------
function h(tag, attrs, kids){
  var e = document.createElement(tag);
  for (var k in (attrs||{})){
    var v = attrs[k];
    if (k==='class') e.className = v;
    else if (k==='text') e.textContent = v;
    else if (k.slice(0,2)==='on') e.addEventListener(k.slice(2), v);
    else if (v===true) e.setAttribute(k,'');
    else if (v!==false && v!=null) e.setAttribute(k, v);
  }
  [].concat(kids||[]).forEach(function(c){ if (c!=null) e.append(c); });
  return e;
}
function tags(str){ return str.split(',').map(function(s){return s.trim();}).filter(Boolean); }
function hasTag(str,t){ return tags(str).some(function(x){ return x.toLowerCase()===t.toLowerCase(); }); }
function toggleTag(str,t){
  var a = tags(str), i = -1;
  a.forEach(function(x,j){ if (x.toLowerCase()===t.toLowerCase()) i=j; });
  if (i>=0) a.splice(i,1); else a.push(t);
  return a.join(', ');
}
function toast(msg){
  var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(function(){ t.classList.remove('on'); }, 1800);
}
function copy(text, what){
  function fallback(){
    var ta = h('textarea'); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); toast(what+' copied!'); } catch(e){ toast('Could not copy. Select the text and press Ctrl+C.'); }
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(function(){ toast(what+' copied!'); }, fallback);
  else fallback();
}

// A lyric line counts when it has at least MIN_WORDS words, is not a
// [Section] label, and is not a repeat of a line already counted.
function countLines(text){
  var seen = {}, n = 0;
  text.split('\n').forEach(function(raw){
    var l = raw.trim();
    if (!l || /^\[.*\]$/.test(l)) return;
    var key = l.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ').trim();
    if (key.split(' ').filter(Boolean).length < MIN_WORDS) return;
    if (seen[key]) return;
    seen[key] = 1; n++;
  });
  return n;
}
function songReady(s){ return !!(s.title.trim() && s.style.trim() && countLines(s.lyrics) >= MIN_LINES); }
function songName(s,i){ return s.title.trim() || 'Song '+(i+1); }
function albumDone(){ return !!(S.artist.trim() && S.title.trim() && S.genre.trim() && S.mood.trim() && S.theme.trim()); }
function songsDone(){ return S.songs.length >= MIN_SONGS && S.songs.every(songReady); }
function coverPrompt(){
  var c = S.cover, p = [];
  var title = S.title.trim() || '(album title)', artist = S.artist.trim() || '(artist name)';
  p.push('Square album cover for a '+(S.genre.trim()||'music')+' album.');
  if (c.scene.trim()) p.push('The picture shows: '+c.scene.trim().replace(/\.$/,'')+'.');
  if (c.art.trim()) p.push('Art style: '+c.art.trim()+'.');
  if (c.colors.trim()) p.push('Main colors: '+c.colors.trim().replace(/\.$/,'')+'.');
  if (S.mood.trim()) p.push('The mood is '+S.mood.trim()+'.');
  if (S.theme.trim()) p.push('The album is about '+S.theme.trim().replace(/\.$/,'')+'.');
  p.push('Put the album title "'+title+'" and the artist name "'+artist+'" on the cover in clear, easy-to-read letters.');
  return p.join(' ');
}
function checklist(){
  var ready = S.songs.filter(songReady).length;
  return [
    [albumDone(), 'Album has an artist name, title, genre, mood and theme'],
    [S.songs.length >= MIN_SONGS, 'Album has '+MIN_SONGS+' to '+MAX_SONGS+' songs (you have '+S.songs.length+')'],
    [S.songs.every(songReady), 'Every song has a title, style tags and at least '+MIN_LINES+' lines of lyrics ('+ready+' of '+S.songs.length+' ready)'],
    [!!S.cover.scene.trim(), 'Album cover is planned'],
    [!!S.cover.image, 'Finished cover picture is added']
  ];
}

// ---- small building blocks -------------------------------------------
function field(label, hint, value, oninput, opts){
  opts = opts || {};
  var id = 'f'+Math.random().toString(36).slice(2);
  var inp = opts.area ? h('textarea', {id:id, placeholder:opts.ph||'', class:opts.cls||''}) : h('input', {id:id, type:'text', placeholder:opts.ph||'', maxlength:opts.max||200});
  inp.value = value;
  inp.addEventListener('input', function(){ oninput(inp.value); save(); refresh(); });
  var lab = h('label', {class:'f', for:id}, [label, hint ? h('span',{class:'hint', text:' '+hint}) : null]);
  var box = h('div', {}, [lab, inp]); box.input = inp; return box;
}
function chipGroups(groups, get, set){
  var wrap = h('div', {class:'chips'}), btns = [];
  groups.forEach(function(g){
    if (g[0]) wrap.append(h('div', {class:'gl', text:g[0]}));
    g[1].forEach(function(t){
      var b = h('button', {type:'button', class:'chip', text:t, 'aria-pressed':'false', onclick:function(){ set(toggleTag(get(), t)); save(); refresh(); sync(); }});
      b.tag = t; btns.push(b); wrap.append(b);
    });
  });
  function sync(){ btns.forEach(function(b){ b.setAttribute('aria-pressed', hasTag(get(), b.tag) ? 'true':'false'); }); }
  sync(); wrap.sync = sync; return wrap;
}
function tagField(label, hint, ph, groups, get, set){
  var chips;
  var f = field(label, hint, get(), function(v){ set(v); if (chips) chips.sync(); }, {ph:ph, max:300});
  chips = chipGroups(groups, get, function(v){ set(v); f.input.value = v; });
  f.append(chips); return f;
}
function navButtons(){
  return h('div', {class:'nav2 noprint'}, [
    S.step > 0 ? h('button', {text:'← Back', onclick:function(){ go(S.step-1); }}) : h('span'),
    S.step < STEPS.length-1 ? h('button', {class:'primary', text:'Next: '+STEPS[S.step+1]+' →', onclick:function(){ go(S.step+1); }}) : h('span')
  ]);
}
function go(n){ S.step = n; save(); render(); window.scrollTo(0,0); }

// ---- steps ------------------------------------------------------------
var refreshers = [];
function refresh(){ renderSteps(); refreshers.forEach(function(f){ f(); }); }

function renderSteps(){
  var done = [albumDone(), songsDone(), !!S.cover.scene.trim(), songsDone(), checklist().every(function(c){return c[0];})];
  var nav = document.getElementById('steps'); nav.textContent = '';
  STEPS.forEach(function(name,i){
    nav.append(h('button', {class: done[i] ? 'done':'', 'aria-current': i===S.step ? 'step' : null, onclick:function(){ go(i); }},
      [h('span', {class:'n', text: done[i] ? '✓' : String(i+1)}), name]));
  });
}

function stepAlbum(){
  return h('div', {}, [
    h('div', {class:'card'}, [
      h('h2', {text:'Step 1: Choose your album theme'}),
      h('p', {class:'lead', text:'Every album has a big idea. Decide who you are as an artist and what your album is all about.'}),
      h('div', {class:'grid2'}, [
        field('Your name', '(so your teacher knows whose album this is)', S.student, function(v){ S.student=v; }, {max:60}),
        field('Artist or band name', '(your stage name)', S.artist, function(v){ S.artist=v; }, {max:60}),
      ]),
      field('Album title', '', S.title, function(v){ S.title=v; }, {max:80}),
      tagField('Genre', '(pick one or two, or type your own)', 'pop, rock', [['', GENRES]], function(){return S.genre;}, function(v){S.genre=v;}),
      tagField('Mood', '(how should people feel when they listen?)', 'happy, energetic', [['', MOODS]], function(){return S.mood;}, function(v){S.mood=v;}),
      field('Theme', '(what is the whole album about? Examples: friendship, adventure, overcoming challenges)', S.theme, function(v){ S.theme=v; }, {area:true, ph:'My album is about...'})
    ]),
    navButtons()
  ]);
}

function stepSongs(){
  var root = h('div');
  var list = h('div', {class:'slist'});
  var editor = h('div', {class:'card'});

  function drawList(){
    list.textContent = '';
    S.songs.forEach(function(s,i){
      var n = countLines(s.lyrics), ok = songReady(s);
      list.append(h('button', {class:'song', 'aria-current': i===S.cur ? 'true' : null, onclick:function(){ S.cur=i; save(); drawList(); drawEditor(); }}, [
        h('b', {text:(i+1)+'.'}), h('span', {class:'t', text:songName(s,i)}),
        h('span', {class:'badge'+(ok?' ok':''), text: ok ? 'Ready' : Math.min(n,MIN_LINES)+'/'+MIN_LINES})
      ]));
    });
    list.append(h('button', {text:'+ Add a song', disabled: S.songs.length >= MAX_SONGS, onclick:function(){
      S.songs.push(newSong()); S.cur = S.songs.length-1; save(); refresh(); drawEditor();
    }}));
    list.append(h('p', {class:'hint', text:'Your album needs '+MIN_SONGS+' to '+MAX_SONGS+' songs.'}));
  }

  function drawEditor(){
    var s = S.songs[S.cur], i = S.cur;
    editor.textContent = '';
    var count = h('span', {class:'count'}), meter = h('div', {class:'meter'}, h('i'));
    var lockMsg = h('p'), suno = h('div', {class:'suno'});
    var bT = h('button', {text:'Copy title', onclick:function(){ copy(s.title.trim(), 'Title'); }});
    var bS = h('button', {text:'Copy style', onclick:function(){ copy(s.style.trim(), 'Style'); }});
    var bL = h('button', {class:'primary', text:'Copy lyrics', onclick:function(){ copy(s.lyrics.trim(), 'Lyrics'); }});

    var lyr = field('Lyrics', '', s.lyrics, function(v){ s.lyrics=v; }, {area:true, cls:'lyrics', ph:'[Verse 1]\nWrite one line of your song on each line...\n\n[Chorus]\nThe part that repeats and gets stuck in your head...'});
    function insert(label){
      var ta = lyr.input, v = ta.value, at = ta.selectionStart;
      if (label==='Verse') label = 'Verse '+((v.match(/\[verse/gi)||[]).length+1);
      var before = v.slice(0,at), after = v.slice(ta.selectionEnd);
      var add = (before && !/\n\n$/.test(before) ? (/\n$/.test(before) ? '\n' : '\n\n') : '') + '['+label+']\n';
      ta.value = before + add + after; ta.focus(); ta.selectionStart = ta.selectionEnd = (before+add).length;
      s.lyrics = ta.value; save(); refresh();
    }
    var sectionRow = h('div', {class:'row', style:'margin-top:8px'}, [h('span', {class:'hint', text:'Add a section label:'})].concat(
      ['Intro','Verse','Chorus','Bridge','Outro'].map(function(l){ return h('button', {type:'button', class:'small', text:'['+l+']', onclick:function(){ insert(l); }}); })));

    var style = tagField('Style tags for Suno', '(describe how this song should sound)', 'pop, happy, piano, female vocals', STYLE_GROUPS, function(){return s.style;}, function(v){s.style=v;});
    var useAlbum = h('button', {type:'button', class:'small', text:'Start with my album genre and mood', onclick:function(){
      s.style = tags(S.genre).concat(tags(S.mood)).filter(function(t){ return !hasTag(s.style,t); }).reduce(function(a,t){ return toggleTag(a,t); }, s.style);
      save(); drawEditor(); refresh();
    }});

    editor.append(
      h('div', {class:'row'}, [h('h2', {text:'Song '+(i+1)}), h('span', {style:'flex:1'}),
        h('button', {class:'small danger', text:'Delete this song', disabled: S.songs.length<=1, onclick:function(){
          if (!confirm('Delete "'+songName(s,i)+'" and its lyrics? This cannot be undone.')) return;
          S.songs.splice(i,1); S.cur = Math.min(S.cur, S.songs.length-1); save(); refresh(); drawEditor();
        }})]),
      field('Song title', '', s.title, function(v){ s.title=v; }, {max:80}),
      field('What is this song about?', '(one or two sentences that fit your album theme)', s.about, function(v){ s.about=v; }, {area:true}),
      lyr, sectionRow, meter,
      h('p', {}, [count]),
      h('p', {class:'hint', text:'A line counts when it has at least '+MIN_WORDS+' words. Section labels like [Chorus] and lines you repeat only count once, so keep writing new lines!'}),
      style,
      (S.genre.trim() || S.mood.trim()) ? h('div', {style:'margin-top:8px'}, useAlbum) : null,
      h('p', {class:'hint', style:'margin-top:8px', text:'Tip: describe the sound. Do not use the names of real singers or bands.'}),
      suno
    );
    suno.append(h('h3', {text:'Take this song to Suno'}), lockMsg, h('div', {class:'row', style:'margin-top:10px'}, [bT, bS, bL]),
      h('ol', {class:'hint'}, [
        h('li', {text:'Open Suno and choose Create, then turn on Custom.'}),
        h('li', {text:'Paste your lyrics into the Lyrics box.'}),
        h('li', {text:'Paste your style tags into the Styles box.'}),
        h('li', {text:'Paste your title, then press Create and listen!'})
      ]));

    function status(){
      var n = countLines(s.lyrics), ok = n >= MIN_LINES, ready = songReady(s);
      count.textContent = ok ? n+' lines. You hit the goal of '+MIN_LINES+'!' : n+' of '+MIN_LINES+' lines written. '+(MIN_LINES-n)+' more to go.';
      count.className = 'count'+(ok?' ok':'');
      meter.className = 'meter'+(ok?' ok':'');
      meter.firstChild.style.width = Math.min(100, n/MIN_LINES*100)+'%';
      var need = [];
      if (!s.title.trim()) need.push('a song title');
      if (!ok) need.push((MIN_LINES-n)+' more line'+(MIN_LINES-n===1?'':'s')+' of lyrics');
      if (!s.style.trim()) need.push('style tags');
      lockMsg.textContent = ready ? 'This song is ready! Copy each part into Suno.' : 'Locked. You still need: '+need.join(', ')+'.';
      suno.className = 'suno'+(ready?' ready':'');
      bT.disabled = bS.disabled = bL.disabled = !ready;
    }
    refreshers = [status, drawList];
    status();
  }

  root.append(
    h('div', {class:'card'}, [
      h('h2', {text:'Step 2: Write your songs'}),
      h('p', {class:'lead', text:'Each song needs a title, style tags, and at least '+MIN_LINES+' lines of lyrics before it unlocks for Suno. You can use AI to brainstorm ideas, but make the words your own.'})
    ]),
    h('div', {class:'songs'}, [list, editor]),
    navButtons()
  );
  drawList(); drawEditor();
  return root;
}

function stepCover(){
  var c = S.cover;
  var prompt = h('pre', {class:'prompt'});
  var pic = h('div');
  function drawPic(){
    pic.textContent = '';
    pic.append(c.image ? h('img', {class:'cover', src:c.image, alt:'Your album cover'}) : h('div', {class:'cover', text:'Your finished cover will show here'}));
  }
  var file = h('input', {type:'file', accept:'image/*', hidden:true, onchange:function(){
    var f = file.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      var img = new Image();
      img.onload = function(){
        var size = Math.min(700, Math.min(img.width, img.height));
        var cv = h('canvas'); cv.width = cv.height = size;
        var m = Math.min(img.width, img.height);
        cv.getContext('2d').drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, size, size);
        c.image = cv.toDataURL('image/jpeg', 0.85); save(); drawPic(); refresh();
      };
      img.onerror = function(){ toast('That file is not a picture.'); };
      img.src = r.result;
    };
    r.readAsDataURL(f); file.value = '';
  }});
  refreshers = [function(){ prompt.textContent = coverPrompt(); }];
  var root = h('div', {}, [
    h('div', {class:'card'}, [
      h('h2', {text:'Step 3: Design your album cover'}),
      h('p', {class:'lead', text:'Your cover should match your album theme, genre and feelings. Answer these questions and Album Studio will write a prompt you can paste into an AI image tool or use as your plan in Canva.'}),
      h('div', {class:'coverbox'}, [
        h('div', {}, [
          field('What is in the picture?', '(people, places, objects, action)', c.scene, function(v){ c.scene=v; }, {area:true, ph:'A kid on a skateboard jumping over a glowing city at night'}),
          field('Main colors', '', c.colors, function(v){ c.colors=v; }, {ph:'purple, electric blue, gold'}),
          tagField('Art style', '', 'cartoon', [['', ART_STYLES]], function(){return c.art;}, function(v){c.art=v;}),
          h('label', {class:'f', text:'Your cover prompt'}), prompt,
          h('button', {class:'primary', text:'Copy cover prompt', onclick:function(){ copy(coverPrompt(), 'Cover prompt'); }})
        ]),
        h('div', {}, [
          pic, file,
          h('div', {class:'row', style:'margin-top:8px'}, [
            h('button', {text:'Add my finished cover', onclick:function(){ file.click(); }}),
            h('button', {class:'small danger', text:'Remove', onclick:function(){ c.image=''; save(); drawPic(); refresh(); }})
          ]),
          h('p', {class:'hint', style:'margin-top:8px', text:'Check: does your cover show the album title and artist name?'})
        ])
      ])
    ]),
    navButtons()
  ]);
  prompt.textContent = coverPrompt(); drawPic();
  return root;
}

function stepTracklist(){
  var box = h('div');
  function draw(){
    box.textContent = '';
    S.songs.forEach(function(s,i){
      function move(d){ var j=i+d; S.songs.splice(j,0,S.songs.splice(i,1)[0]); S.cur=j; save(); refresh(); draw(); }
      box.append(h('div', {class:'track'}, [
        h('span', {class:'num', text:String(i+1)}),
        h('span', {class:'t', text:songName(s,i)}),
        h('span', {class:'badge'+(songReady(s)?' ok':''), text: songReady(s) ? 'Ready' : 'Not finished'}),
        h('button', {class:'small', text:'↑', 'aria-label':'Move '+songName(s,i)+' up', disabled:i===0, onclick:function(){ move(-1); }}),
        h('button', {class:'small', text:'↓', 'aria-label':'Move '+songName(s,i)+' down', disabled:i===S.songs.length-1, onclick:function(){ move(1); }}),
        h('button', {class:'small', text:'Edit', onclick:function(){ S.cur=i; go(1); }})
      ]));
    });
  }
  refreshers = [];
  draw();
  return h('div', {}, [
    h('div', {class:'card'}, [
      h('h2', {text:'Step 4: Create your tracklist'}),
      h('p', {class:'lead', text:'Put your songs in the order people will hear them. Think about which song should open the album and which should end it. Do your titles fit your theme?'}),
      box
    ]),
    navButtons()
  ]);
}

function stepFinish(){
  refreshers = [];
  var sheet = h('div', {class:'sheet'});
  var head = h('div', {class:'head'});
  if (S.cover.image) head.append(h('img', {src:S.cover.image, alt:'Album cover'}));
  head.append(h('div', {}, [
    h('h2', {text:S.title.trim() || 'Untitled album'}),
    h('div', {class:'meta', text:'by '+(S.artist.trim() || '(artist name)')}),
    h('div', {class:'meta', text:'Created by: '+(S.student.trim() || '________________')}),
    h('div', {class:'meta', text:'Genre: '+(S.genre.trim()||'—')+'   |   Mood: '+(S.mood.trim()||'—')}),
    h('div', {class:'meta', text:'Theme: '+(S.theme.trim()||'—')})
  ]));
  sheet.append(head, h('h3', {text:'Tracklist'}), h('ol', {}, S.songs.map(function(s,i){ return h('li', {text:songName(s,i)}); })));
  S.songs.forEach(function(s,i){
    sheet.append(h('div', {class:'sg'}, [
      h('h3', {text:(i+1)+'. '+songName(s,i)}),
      s.about.trim() ? h('p', {text:'About: '+s.about.trim()}) : null,
      h('p', {class:'style', text:'Style: '+(s.style.trim()||'—')+'   ('+countLines(s.lyrics)+' lines of lyrics)'}),
      h('div', {class:'lyr', text:s.lyrics.trim() || '(no lyrics yet)'})
    ]));
  });
  var list = checklist();
  return h('div', {}, [
    h('div', {class:'card noprint'}, [
      h('h2', {text:'Step 5: Check and turn in'}),
      h('ul', {class:'check'}, list.map(function(c){ return h('li', {class:c[0]?'ok':'', text:c[1]}); })),
      h('div', {class:'row', style:'margin-top:14px'}, [
        h('button', {class:'primary', text:'Print or save as PDF', onclick:function(){ window.print(); }}),
        h('button', {text:'Save to file', onclick:saveFile}),
        h('span', {style:'flex:1'}),
        h('button', {class:'small danger', text:'Start a new album', onclick:function(){
          if (!confirm('Erase this whole album and start over? Save to file first if you want to keep it.')) return;
          S = blank(); save(); render();
        }})
      ])
    ]),
    sheet,
    navButtons()
  ]);
}

function render(){
  refreshers = [];
  var main = document.getElementById('main'); main.textContent = '';
  main.append([stepAlbum, stepSongs, stepCover, stepTracklist, stepFinish][S.step]());
  renderSteps();
}

// ---- save / open file -------------------------------------------------
function saveFile(){
  var name = ((S.student.trim()||'my')+' '+(S.title.trim()||'album')).replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-') + '.album.json';
  var a = h('a', {href:URL.createObjectURL(new Blob([JSON.stringify(S)], {type:'application/json'})), download:name});
  document.body.append(a); a.click(); a.remove();
  toast('Album file saved');
}
document.getElementById('btnSave').onclick = saveFile;
document.getElementById('btnOpen').onclick = function(){ document.getElementById('fileOpen').click(); };
document.getElementById('fileOpen').onchange = function(){
  var f = this.files[0]; if (!f) return; this.value = '';
  var r = new FileReader();
  r.onload = function(){
    var d = null; try { d = clean(JSON.parse(r.result)); } catch(e){}
    if (!d) { toast('That is not an Album Studio file.'); return; }
    if (!confirm('Open this file? It will replace the album on your screen.')) return;
    S = d; save(); render(); toast('Album opened');
  };
  r.readAsText(f);
};

render();
</script>
</body>
</html>
