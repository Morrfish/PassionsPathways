<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathway CAD</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 8l8-4 8 4v8l-8 4-8-4z' fill='%231b9aaa'/%3E%3Cpath d='M4 8l8 4 8-4M12 12v8' stroke='white' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="titlebar">
  <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v8l-8 4-8-4z" fill="#2ec4b6"/><path d="M4 8l8 4 8-4M12 12v8" stroke="#0e3b43" stroke-width="1.4" fill="none"/></svg>Pathway <b>CAD</b></div>
  <input id="docName" title="Part name" spellcheck="false">
  <nav id="tabs"></nav>
</header>
<div id="ribbon"></div>
<main>
  <aside id="browser">
    <div class="phead">Model</div>
    <div id="tree"></div>
  </aside>
  <section id="viewWrap">
    <div id="view3d"></div>
    <div id="dimLayer"></div>
    <div id="cmdPanel" class="panel" hidden></div>
    <div id="sketchPanel" class="panel" hidden></div>
    <div id="navcube">
      <button data-v="top" title="Top view">Top</button>
      <button data-v="front" title="Front view">Front</button>
      <button data-v="right" title="Right view">Right</button>
      <button data-v="home" title="Home view (F6)">⌂</button>
      <button data-v="fit" title="Zoom all">⤢</button>
    </div>
    <div id="busy" hidden><span></span>rebuilding</div>
    <div id="loading"><div class="spin"></div><p>Loading the modeling engine…</p></div>
  </section>
</main>
<footer id="status"><span id="statusMsg">Loading…</span><span id="statusRight"></span></footer>
<div id="toasts"></div>
<div id="modal" hidden></div>
<script type="module" src="app.js"></script>
<script>
  document.getElementById('navcube').addEventListener('click', function (e) {
    var v = e.target.dataset && e.target.dataset.v; if (!v || !window.pathwayCad) return;
    if (v === 'fit') window.pathwayCad.vp.fit(); else window.pathwayCad.vp.setView(v);
  });
</script>
</body>
</html>
